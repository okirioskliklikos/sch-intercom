[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "school-intercom"
version = "0.1.0"
description = "Experimental LAN school intercom audio prototype"
requires-python = ">=3.10"
dependencies = ["sounddevice>=0.5,<1", "cryptography>=42"]

[project.optional-dependencies]
# Γραφικό περιβάλλον: Director (`director.main --gui`) και tray/παράθυρο Client (5C1).
gui = ["PySide6-Essentials>=6.6,<7"]

[tool.setuptools.packages.find]
include = ["director*", "client*", "shared*"]

[tool.setuptools.package-data]
"shared.ui" = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
